name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    container:
      image: oryd/xgoreleaser:1.26.0-2.14.1
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  release-artifact-canary:
    name: Released artifact canary (${{ matrix.os }})
    needs: [release-please, release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-amd64
            executable_suffix: ''
          - os: windows-latest
            asset_suffix: windows-amd64.exe
            executable_suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Download exact GoReleaser asset
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          ASSET="lumen-${RELEASE_TAG#v}-${ASSET_SUFFIX}"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/ory/lumen/releases/download/$RELEASE_TAG/$ASSET" \
            -o "$RUNNER_TEMP/lumen${EXECUTABLE_SUFFIX}"
          chmod +x "$RUNNER_TEMP/lumen${EXECUTABLE_SUFFIX}"
      - name: Index and search with released artifact
        shell: bash
        env:
          LUMEN_ARTIFACT: ${{ runner.temp }}/lumen${{ matrix.executable_suffix }}
        run: go test -tags=fts5 ./internal/release -run TestBuiltArtifactIndexesChunks -count=1 -v

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Pack and verify OpenCode distribution
        run: |
          mkdir -p "$RUNNER_TEMP/lumen-pack" "$RUNNER_TEMP/lumen-install"
          PACKAGE_NAME=$(npm pack --pack-destination "$RUNNER_TEMP/lumen-pack")
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/lumen-install" \
            "$RUNNER_TEMP/lumen-pack/$PACKAGE_NAME"
          node scripts/verify_opencode_package.mjs \
            "$RUNNER_TEMP/lumen-install/node_modules/@ory/lumen-opencode"
          echo "PACKAGE_TARBALL=$RUNNER_TEMP/lumen-pack/$PACKAGE_NAME" >> "$GITHUB_ENV"
      - name: Publish verified tarball
        run: npm publish "$PACKAGE_TARBALL" --access public --provenance
