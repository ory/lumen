name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.actor != 'release-please[bot]'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-go-cgo
          max-size: 500M

      - name: Test
        run: |
          # Use ccache to speed up repeated CGO (C) compilation of sqlite3/tree-sitter.
          export CC="ccache gcc"
          export CXX="ccache g++"
          # Print a heartbeat every 60 s so GitHub Actions does not kill the
          # runner during the silent CGO (sqlite3) compilation phase.
          (while true; do echo "[ci] tests still running…"; sleep 60; done) &
          HEARTBEAT=$!
          trap 'kill "$HEARTBEAT" 2>/dev/null || true' EXIT
          CGO_ENABLED=1 go test -p 1 -tags=fts5 -timeout=30m \
            -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang

      - name: Vet
        run: go vet -tags=fts5 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.actor != 'release-please[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --build-tags=fts5

  semantic_e2e:
    name: Semantic E2E
    runs-on: ubuntu-latest
    if: github.actor != 'release-please[bot]'
    services:
      ollama:
        # Keep semantic-search snapshots reproducible. New Ollama runtimes can
        # change embedding execution even when the all-minilm model is unchanged.
        image: ollama/ollama@sha256:a6149234667efc71d37766d61c1a16f24c33e4cd7a0bf4125c44a7e47e2419c4
        ports:
          - 11434:11434
        env:
          OLLAMA_NUM_PARALLEL: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Ollama
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/ && break
            sleep 1
          done

      - name: Pull embedding model
        run:
          'curl -sf http://localhost:11434/api/pull -d ''{"name":"all-minilm"}'''

      - name: E2E tests
        run: make e2e
        env:
          OLLAMA_HOST: http://localhost:11434
          LUMEN_EMBED_MODEL: all-minilm
          LUMEN_EMBED_DIMS: '384'

      - name: E2E lang tests
        run: make e2e-lang
        env:
          OLLAMA_HOST: http://localhost:11434
          LUMEN_EMBED_MODEL: all-minilm
          LUMEN_EMBED_DIMS: '384'

      - name: Install pinned agent CLIs
        run: npm install --global @anthropic-ai/claude-code@2.1.226 opencode-ai@1.18.15

      - name: Install pinned Codex CLI
        run: |
          curl -fL --retry 3 \
            https://github.com/openai/codex/releases/download/rust-v0.147.0/codex-x86_64-unknown-linux-musl.tar.gz \
            -o "$RUNNER_TEMP/codex.tar.gz"
          tar -xzf "$RUNNER_TEMP/codex.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/lumen-agent-bin"
          mv "$RUNNER_TEMP/codex-x86_64-unknown-linux-musl" "$RUNNER_TEMP/lumen-agent-bin/codex"
          echo "$RUNNER_TEMP/lumen-agent-bin" >> "$GITHUB_PATH"

      # E2E is a required check. Keeping installation canaries in this job
      # makes a broken agent distribution merge-blocking instead of advisory.
      - name: Fresh-install Claude, Codex, and OpenCode canaries
        run: bash scripts/test_agent_installations.sh
        env:
          OLLAMA_HOST: http://localhost:11434
          LUMEN_EMBED_MODEL: all-minilm
          LUMEN_EMBED_DIMS: '384'

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.actor != 'release-please[bot]'
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up MinGW for native CGO
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Build
        shell: bash
        run: |
          VERSION=$(grep -o '"[0-9][^"]*"' .release-please-manifest.json | tr -d '"' | head -1)
          CGO_ENABLED=1 go build -tags=fts5 \
            -ldflags="-s -w -X github.com/ory/lumen/cmd.buildVersion=$VERSION" \
            -o "bin/lumen${LUMEN_EXE}" .
        env:
          LUMEN_EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Assert semver version output
        shell: bash
        run: |
          VER=$("bin/lumen${LUMEN_EXE}" version)
          echo "Binary reported version: $VER"
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]' \
            || { echo "ERROR: version output does not match semver pattern"; exit 1; }
        env:
          LUMEN_EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Execute artifact indexing and search smoke
        shell: bash
        run: go test -tags=fts5 ./internal/release -run TestBuiltArtifactIndexesChunks -count=1 -v
        env:
          LUMEN_ARTIFACT: ${{ github.workspace }}/bin/lumen${{ runner.os == 'Windows' && '.exe' || '' }}

  scripts:
    name: Script tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.actor != 'release-please[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Unix script tests
        if: runner.os != 'Windows'
        run: bash scripts/test_run.sh

      - name: Windows dispatch test (cmd /c PATHEXT + clean stdout)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\test_run_dispatch_windows.bat

      - name: Windows launcher MCP handshake (run.cmd stdio)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/test_run_windows.ps1

      - name: Setup Node.js for spawn-semantics test
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install cross-spawn for parallel transport test
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Spawn-semantics regression guard
        run: node scripts/test_run_spawn.js

  # The repository ruleset requires the "E2E" check. This aggregator keeps
  # that stable context while making semantic tests, fresh host installs,
  # native artifacts, and every launcher platform transitively merge-gating.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    if: ${{ always() && github.actor != 'release-please[bot]' }}
    needs: [semantic_e2e, build, scripts]
    steps:
      - name: Require every distribution and runtime check
        env:
          SEMANTIC_E2E_RESULT: ${{ needs.semantic_e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
        run: |
          test "$SEMANTIC_E2E_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$SCRIPTS_RESULT" = success
